<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="100%" height="100%">
  <defs>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <filter id="cardShadowLight" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .step { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; }
    .heading { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; font-size: 12px; fill: #64748b; font-weight: 400; }
  </style>

  <!-- Background Canvas -->
  <rect width="920" height="210" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Connector Lines -->
  <path d="M 215 88 L 265 88" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M 445 88 L 495 88" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>
  <path d="M 675 88 L 725 88" stroke="#cbd5e1" stroke-width="2" fill="none" marker-end="url(#arrowGray)"/>

  <!-- Return Loop -->
  <path d="M 815 138 L 815 174 L 125 174 L 125 138" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4,4" fill="none" marker-end="url(#arrowGreen)"/>
  <rect x="405" y="163" width="110" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
  <text x="460" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" font-weight="600" fill="#059669">Restores Baseline</text>

  <!-- Card 1 -->
  <g transform="translate(35, 38)" filter="url(#cardShadowLight)">
    <rect width="180" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="100" rx="2" fill="#0284c7"/>
    <text x="18" y="28" class="step" fill="#0284c7">01 / Control Plane</text>
    <text x="18" y="54" class="heading">simulator.sh</text>
    <text x="18" y="76" class="subtext">Interactive CLI Runner</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(265, 38)" filter="url(#cardShadowLight)">
    <rect width="180" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="100" rx="2" fill="#e11d48"/>
    <text x="18" y="28" class="step" fill="#e11d48">02 / Fault Injection</text>
    <text x="18" y="54" class="heading">break.sh</text>
    <text x="18" y="76" class="subtext">Injects Linux Failure</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(495, 38)" filter="url(#cardShadowLight)">
    <rect width="180" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="100" rx="2" fill="#4f46e5"/>
    <text x="18" y="28" class="step" fill="#4f46e5">03 / Systems Triage</text>
    <text x="18" y="54" class="heading">Live Diagnosis</text>
    <text x="18" y="76" class="subtext">curl • ss • iptables • df</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(725, 38)" filter="url(#cardShadowLight)">
    <rect width="180" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="100" rx="2" fill="#10b981"/>
    <text x="18" y="28" class="step" fill="#10b981">04 / Verification</text>
    <text x="18" y="54" class="heading">verify.sh</text>
    <text x="18" y="76" class="subtext">Automated Assertions</text>
  </g>
</svg>
